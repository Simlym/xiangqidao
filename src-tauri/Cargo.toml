[package]
name = "xiangqidao"
version = "0.1.0"
description = "象棋道多端客户端"
authors = ["Xiangqidao"]
edition = "2021"

[lib]
name = "xiangqidao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

