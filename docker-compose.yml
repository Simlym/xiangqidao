# 国内网络优化：默认经 DaoCloud 公共镜像源拉取 Docker Hub 镜像，pip 走阿里源、npm 走 npmmirror。
# 均可在根目录 .env 覆盖（IMAGE_REGISTRY / PIP_INDEX_URL / NPM_REGISTRY）；海外服务器可设 IMAGE_REGISTRY=docker.io 直连官方源。
services:
  database:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xiangqidao}
      POSTGRES_USER: ${POSTGRES_USER:-xiangqidao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在根目录 .env 中设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?请先在根目录 .env 中设置 SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xiangqidao}:${POSTGRES_PASSWORD:?请先在根目录 .env 中设置 POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-xiangqidao}
      XIANGQI_ENGINE: ${XIANGQI_ENGINE:-}
      JIEQI_ENGINE: ${JIEQI_ENGINE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FORWARDED_ALLOW_IPS: "*"
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      CLOUDBOOK_ENABLED: ${CLOUDBOOK_ENABLED:-1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROTOCOL: ${LLM_PROTOCOL:-openai_chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    volumes:
      - ./local-engines:/app/data/engines
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  postgres-data:
