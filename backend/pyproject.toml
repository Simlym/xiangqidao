[project]
name = "xiangqidao-backend"
version = "0.1.0"
description = "Xiangqidao FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "py-cpuinfo>=9.0",
    "py7zr>=0.21",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
